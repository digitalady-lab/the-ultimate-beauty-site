<!-- Cookie Consent Banner — TUB kanonikus (Shape-replika 2026-05-03, A-variant) -->
<style>
#cookie-banner{position:fixed;bottom:1.5rem;left:1rem;right:1rem;max-width:28rem;z-index:9999;background:var(--ivory,#fdfaf6);border:1px solid rgba(184,150,90,.2);padding:1.25rem;border-radius:14px;box-shadow:0 20px 50px rgba(26,24,22,.18);font-family:'Montserrat',sans-serif;display:none}
@media(min-width:768px){#cookie-banner{left:1.5rem;right:auto}}
#cookie-banner.show{display:block;animation:cookieSlide .5s ease-out}
#cookie-banner p{font-size:.85rem;line-height:1.55;color:var(--charcoal,#1a1816);margin:0 0 1rem 0}
#cookie-banner a{color:var(--charcoal,#1a1816);text-decoration:underline}
#cookie-banner a:hover{color:var(--gold,#b8965a)}
#cookie-banner .cookie-buttons{display:flex;gap:.75rem}
#cookie-banner button{flex:1;padding:.7rem 1rem;border-radius:8px;font-size:.78rem;font-weight:500;letter-spacing:.5px;cursor:pointer;font-family:'Montserrat',sans-serif;transition:all .2s}
#cookie-banner .cookie-accept{background:var(--gold,#b8965a);color:var(--ivory,#fdfaf6);border:1px solid var(--gold,#b8965a)}
#cookie-banner .cookie-accept:hover{background:var(--charcoal,#1a1816);border-color:var(--charcoal,#1a1816)}
#cookie-banner .cookie-essential{background:transparent;color:var(--charcoal,#1a1816);border:1px solid rgba(26,24,22,.2)}
#cookie-banner .cookie-essential:hover{background:rgba(26,24,22,.05)}
@keyframes cookieSlide{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
<div id="cookie-banner" role="dialog" aria-label="Cookie értesítés">
  <p>Ez az oldal cookie-kat használ a jobb felhasználói élmény érdekében. Részletek az <a href="adatvedelem.html" target="_blank" rel="noopener">Adatkezelési tájékoztatóban</a>.</p>
  <div class="cookie-buttons">
    <button type="button" class="cookie-accept" data-cookie="all">Elfogadom</button>
    <button type="button" class="cookie-essential" data-cookie="essential">Csak a szükségesek</button>
  </div>
</div>
<script>
(function(){function i(){var b=document.getElementById('cookie-banner');if(!b)return;if(!localStorage.getItem('cookie_consent'))b.classList.add('show');b.addEventListener('click',function(e){var x=e.target.closest('[data-cookie]');if(!x)return;localStorage.setItem('cookie_consent',x.getAttribute('data-cookie'));b.classList.remove('show')})}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',i);else i()})();
</script>
<!-- /Cookie Consent Banner -->
