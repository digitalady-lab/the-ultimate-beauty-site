# ─────────────────────────────────────────────────────────────────────────────
#  The Ultimate Beauty — Netlify konfiguráció
#
#  A 301-es átirányítások szándékosan a `_redirects` fájlban vannak, nem itt:
#  a netlify.toml redirect-szabályai megelőznék a `_redirects` szabályait, és
#  a kettő keverése nehezen átlátható sorrendet eredményez. Egy hely = egy
#  igazság. Átirányítást tehát a `_redirects` fájlba írj.
#
#  Build-szekciót szándékosan nem tartalmaz ez a fájl: a projekt statikus,
#  a publish-könyvtár a Netlify felületén beállított érték marad.
# ─────────────────────────────────────────────────────────────────────────────

# A belső használatú e-mail-aláírás sablonok ne kerüljenek a Google indexébe —
# nem tartalmi oldalak, de duplikált/gyenge tartalomként rontják a megítélést.
[[headers]]
  for = "/email-signature-*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/assets/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# A HTML mindig frissüljön, hogy egy javítás azonnal élesedjen.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
